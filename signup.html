<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — GCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/auth.css" />
</head>
<body class="auth-body">

  <header class="auth-topbar">
    <a href="home.html" class="auth-logo">GCS</a>
    <a href="index.html" class="auth-topbar-link">&larr; Back to home</a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-mode-strip" aria-hidden="true">
        <span class="auth-mode-chip auth-mode-chip--blind">Blind</span>
        <span class="auth-mode-chip auth-mode-chip--deaf">Deaf</span>
        <span class="auth-mode-chip auth-mode-chip--normal">Normal</span>
      </div>

      <h1 class="auth-heading">Sign Up</h1>
      <p class="auth-subtext">Create one account to use every mode.</p>

      <form id="signup-form" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="signup-name">Name</label>
          <input class="auth-input" type="text" id="signup-name" name="name" autocomplete="name" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-email">Email</label>
          <input class="auth-input" type="email" id="signup-email" name="email" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-password">Password</label>
          <input class="auth-input" type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="6" />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-confirm">Confirm Password</label>
          <input class="auth-input" type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required minlength="6" />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-mode">Preferred mode (optional)</label>
          <select class="auth-select" id="signup-mode" name="mode">
            <option value="">No preference</option>
            <option value="blind">Blind — speech to text</option>
            <option value="deaf">Deaf — gesture detection</option>
            <option value="normal">Normal — text to speech</option>
          </select>
        </div>

        <button type="submit" class="auth-btn" id="signup-submit">Create Account</button>

        <div class="auth-status" id="signup-status" role="status" aria-live="polite"></div>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script type="module">
    import { signUp, friendlyAuthError } from "./scripts/auth.js";

    const form = document.getElementById("signup-form");
    const statusEl = document.getElementById("signup-status");
    const submitBtn = document.getElementById("signup-submit");

    function setStatus(message, state) {
      statusEl.textContent = message;
      if (state) {
        statusEl.setAttribute("data-state", state);
      } else {
        statusEl.removeAttribute("data-state");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("", null);

      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const confirm = document.getElementById("signup-confirm").value;
      const preferredMode = document.getElementById("signup-mode").value;

      if (password !== confirm) {
        setStatus("Passwords don't match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";

      try {
        await signUp({ name, email, password, preferredMode });
        setStatus("Account created. Redirecting…", "success");
        window.location.href = "home.html";
      } catch (error) {
        setStatus(friendlyAuthError(error), "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
