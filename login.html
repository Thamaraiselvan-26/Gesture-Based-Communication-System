<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — GCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/auth.css" />
</head>
<body class="auth-body">

  <header class="auth-topbar">
    <a href="home.html" class="auth-logo">GCS</a>
    <a href="index.html" class="auth-topbar-link">&larr; Back to home</a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-mode-strip" aria-hidden="true">
        <span class="auth-mode-chip auth-mode-chip--blind">Blind</span>
        <span class="auth-mode-chip auth-mode-chip--deaf">Deaf</span>
        <span class="auth-mode-chip auth-mode-chip--normal">Normal</span>
      </div>

      <h1 class="auth-heading">Log In</h1>
      <p class="auth-subtext">One account works across all three modes.</p>

      <form id="login-form" novalidate>
        <div class="auth-field">
          <label class="auth-label" for="login-email">Email</label>
          <input class="auth-input" type="email" id="login-email" name="email" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="login-password">Password</label>
          <input class="auth-input" type="password" id="login-password" name="password" autocomplete="current-password" required minlength="6" />
        </div>

        <button type="submit" class="auth-btn" id="login-submit">Log In</button>

        <div class="auth-status" id="login-status" role="status" aria-live="polite"></div>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script type="module">
    import { logIn, friendlyAuthError } from "./scripts/auth.js";

    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("login-status");
    const submitBtn = document.getElementById("login-submit");

    function setStatus(message, state) {
      statusEl.textContent = message;
      if (state) {
        statusEl.setAttribute("data-state", state);
      } else {
        statusEl.removeAttribute("data-state");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("", null);

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";

      try {
        await logIn({ email, password });
        setStatus("Logged in. Redirecting…", "success");
        window.location.href = "home.html";
      } catch (error) {
        setStatus(friendlyAuthError(error), "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
